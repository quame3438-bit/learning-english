<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英语逐句听力 Pro v8.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#222}
.wrap{max-width:820px;margin:auto;padding:14px 10px 36px}
h1{font-size:25px;margin:8px 2px 14px}
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.fileBtn{border:0;border-radius:12px;background:#111;color:#fff;padding:11px 12px;font-size:15px;font-weight:600;flex:1;text-align:center}
button.secondary,.fileBtn.secondary{background:#eee;color:#222}
input[type=file]{display:none}
video,audio{width:100%;margin-top:10px;border-radius:12px;background:#000}
.subtitle{font-size:24px;font-weight:700;min-height:90px;padding:12px 8px;text-align:center;white-space:pre-wrap;line-height:1.5;user-select:text;-webkit-user-select:text}
.meta{text-align:center;color:#888;font-size:13px}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;align-items:center;margin-top:14px}
.ctrl{display:flex;align-items:center;gap:7px;min-height:42px;white-space:nowrap}
select{min-width:0;max-width:100%;padding:8px 9px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:14px}
.transport,.abrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.transportCell{display:flex;flex-direction:column;gap:6px}
.transportCell button,.abrow button{height:44px}
.abrow{margin-top:9px}
.on{background:#1f6feb!important;color:#fff!important}
.abInfo,.tip,.status{font-size:12px;color:#777;text-align:center;margin-top:7px}
#wave{width:100%;height:84px;background:#f4f5f7;border-radius:12px;display:block;touch-action:none;cursor:pointer;margin-top:12px}
.waveMeta{display:flex;justify-content:space-between;color:#777;font-size:12px;margin-top:4px}
.item{padding:11px 8px;border-bottom:1px solid #eee;white-space:pre-wrap;line-height:1.5;cursor:pointer}
.item.active{background:#edf3ff;border-radius:10px}
#lookup{position:fixed;z-index:99;left:12px;right:12px;bottom:16px;max-width:760px;margin:auto;background:#111;color:#fff;border-radius:16px;padding:13px;display:none;box-shadow:0 12px 32px rgba(0,0,0,.3)}
#lookupText{font-weight:700;word-break:break-word}
.lookupBtns{display:flex;gap:8px;margin-top:10px}
.lookupBtns button{background:#fff;color:#111;padding:9px}
@media(max-width:620px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.subtitle{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<h1>英语逐句听力</h1>

<div class="card">
  <div class="row">
    <label class="fileBtn">＋ 添加视频/音频<input id="mediaFile" type="file" accept="video/*,audio/*"></label>
    <label class="fileBtn secondary">＋ 导入字幕文件<input id="srtFile" type="file" accept="*/*"></label>
  </div>
  <div id="playerBox"></div>

  <canvas id="wave"></canvas>
  <div class="waveMeta"><span id="curTime">00:00</span><span id="duration">00:00</span></div>
  <div class="status" id="waveStatus">添加媒体后生成波形；竖线表示当前播放位置，可点击或拖动定位。</div>
</div>

<div class="card">
  <div class="subtitle" id="subtitle">请先导入字幕</div>
  <div class="meta" id="meta">0 / 0</div>
  <div class="tip">按住并选中字幕中的单词、短语或句子，可用 Google 搜索或发音。</div>
</div>

<div class="card">
  <div class="row">
    <button onclick="prevLine()" class="secondary">上一句</button>
    <button id="mainPlayPauseBtn" onclick="toggleMainPlayPause()">▶ 播放</button>
    <button onclick="nextLine()" class="secondary">下一句</button>
  </div>

  <div class="transport" style="margin-top:9px">
    <div class="transportCell">
      <button class="secondary" onclick="seekRelative(-getRewindSeconds())">⏪ 快退</button>
      <select id="rewindSeconds"></select>
    </div>
    <div class="transportCell">
      <button class="secondary" disabled style="opacity:.35">定位</button>
      <div style="height:36px"></div>
    </div>
    <div class="transportCell">
      <button class="secondary" onclick="seekRelative(getForwardSeconds())">快进 ⏩</button>
      <select id="forwardSeconds"></select>
    </div>
  </div>

  <div class="abrow">
    <button id="btnA" class="secondary" onclick="setA()">A</button>
    <button id="btnAB" class="secondary" onclick="toggleABLoop()">A/B循环</button>
    <button id="btnB" class="secondary" onclick="setB()">B</button>
  </div>
  <div class="abInfo" id="abInfo">A：未设置　B：未设置</div>

  <div class="controls">
    <div class="ctrl">
      <label for="displayMode">显示</label>
      <select id="displayMode" onchange="render()">
        <option value="both">中英</option>
        <option value="zh">中文</option>
        <option value="en">英文</option>
        <option value="none">不显示</option>
      </select>
    </div>

    <div class="ctrl">
      <label for="subtitleSize">字体</label>
      <select id="subtitleSize" onchange="applySubtitleSize()">
        <option>16</option><option>18</option><option>20</option><option>22</option>
        <option selected>24</option><option>26</option><option>28</option><option>30</option>
        <option>32</option><option>36</option><option>40</option><option>44</option><option>48</option>
      </select>
    </div>

    <div class="ctrl">
      <label for="speed">速度</label>
      <select id="speed" onchange="applySpeed()">
        <option value="0.2">0.2×</option><option value="0.4">0.4×</option>
        <option value="0.5">0.5×</option><option value="0.8">0.8×</option>
        <option value="1" selected>1.0×</option><option value="1.2">1.2×</option>
        <option value="1.5">1.5×</option><option value="2">2.0×</option>
      </select>
    </div>

    <div class="ctrl">
      <label for="playMode">播放模式</label>
      <select id="playMode" onchange="onPlayModeChange()">
        <option value="full" selected>完整播放</option>
        <option value="current">播放本句</option>
        <option value="loop">单句循环</option>
        <option value="repeatNext">（ ）遍后播放下一句</option>
      </select>
    </div>

    <div id="repeatWrap" style="display:none;grid-column:1/-1">
      <div class="controls" style="margin:0">
        <div class="ctrl">
          <label for="repeatCount">遍数</label>
          <select id="repeatCount"></select>
        </div>
        <div class="ctrl">
          <label for="gap">时间间隔</label>
          <select id="gap">
            <option value="1">1秒</option><option value="2">2秒</option><option value="3" selected>3秒</option>
            <option value="5">5秒</option><option value="6">6秒</option><option value="10">10秒</option>
            <option value="30">30秒</option><option value="60">1分钟</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <b>字幕列表</b>
  <div id="list"></div>
</div>
</div>

<div id="lookup">
  <div id="lookupText"></div>
  <div class="lookupBtns">
    <button onclick="googleSearchSelection()">Google搜索</button>
    <button onclick="speakSelection()">🔊 发音</button>
    <button onclick="hideLookup()">关闭</button>
  </div>
</div>

<script>
let media=null, subs=[], current=0, mediaUrl=null;
let modeActive=false, repeatDone=0, endTimer=null, lock=false;
let pointA=null, pointB=null, abLoopEnabled=false;
let wavePeaks=[], waveReady=false, dragWave=false;
let selectedText="";
const $=s=>document.querySelector(s);

(function initOptions(){
  for(const id of ["rewindSeconds","forwardSeconds"]){
    const s=$("#"+id);
    for(let i=1;i<=10;i++){
      const o=document.createElement("option");
      o.value=i;o.textContent=i+"秒";if(i===5)o.selected=true;s.appendChild(o);
    }
  }
  const r=$("#repeatCount");
  const z=document.createElement("option");z.value="0";z.textContent="0";r.appendChild(z);
  const inf=document.createElement("option");inf.value="inf";inf.textContent="无限";r.appendChild(inf);
  for(let i=1;i<=100;i++){
    const o=document.createElement("option");o.value=i;o.textContent=i;if(i===1)o.selected=true;r.appendChild(o);
  }
})();

$("#mediaFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  clearTimeout(endTimer);
  if(mediaUrl)URL.revokeObjectURL(mediaUrl);
  mediaUrl=URL.createObjectURL(f);
  $("#playerBox").innerHTML=f.type.startsWith("video/")?
    `<video id="media" controls playsinline preload="metadata" src="${mediaUrl}"></video>`:
    `<audio id="media" controls preload="metadata" src="${mediaUrl}"></audio>`;
  media=$("#media");
  media.ontimeupdate=watch;
  media.onplay=updatePlayButton;
  media.onpause=updatePlayButton;
  media.onended=()=>{modeActive=false;updatePlayButton()};
  media.onloadedmetadata=()=>{updateTimes();drawWave()};
  applySpeed();
  pointA=pointB=null;abLoopEnabled=false;updateAB();
  buildWave(f);
};

$("#srtFile").onchange=async e=>{
  const f=e.target.files && e.target.files[0];
  if(!f)return;

  try{
    const buf=await f.arrayBuffer();

    // 先按 UTF-8 读取。绝大多数 SRT/VTT 都可以直接读取。
    let text="";
    try{
      text=new TextDecoder("utf-8",{fatal:false}).decode(buf);
    }catch(_){
      text="";
    }

    // 去 BOM / 标准化换行
    text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");

    // 只看字幕内容，不依赖文件后缀
    if(/^WEBVTT\b/i.test(text.trim())){
      subs=parseVTT(text);
    }else{
      subs=parseSRT(text);
    }

    // 有些 TXT 字幕也可能是 SRT 内容；若仍未解析到，尝试更宽松解析
    if(!subs.length){
      subs=parseLooseSubtitle(text);
    }

    if(!subs.length){
      throw new Error("没有识别到字幕时间轴");
    }

    current=0;
    repeatDone=0;
    modeActive=false;
    render();

    // 导入成功后清空 input value，方便以后再次选择同一个字幕文件
    e.target.value="";
  }catch(err){
    console.error(err);
    alert("字幕没有识别成功。请确认字幕内容里有类似 00:00:01,000 --> 00:00:03,000 的时间轴。");
    e.target.value="";
  }
};

function parseTime(t){
  const m=t.trim().match(/(?:(\d+):)?(\d+):(\d+)[,.](\d+)/);
  if(!m)return 0;
  return +(m[1]||0)*3600 + +m[2]*60 + +m[3] + +(m[4].padEnd(3,"0").slice(0,3))/1000;
}
function parseSRT(t){
  return t.replace(/^\uFEFF/,"").replace(/\r/g,"").trim().split(/\n\s*\n/).map(b=>{
    const l=b.split("\n"),i=l.findIndex(x=>x.includes("-->"));
    if(i<0)return null;
    const a=l[i].split("-->");
    return {start:parseTime(a[0]),end:parseTime(a[1]),text:l.slice(i+1).join("\n").trim()};
  }).filter(Boolean);
}
function parseVTT(t){
  return parseSRT(t.replace(/^\uFEFF/,"").replace(/^WEBVTT[^\n]*\n+/i,""));
}
function parseLooseSubtitle(t){
  const lines=t.replace(/^\uFEFF/,"").replace(/\r/g,"").split("\n");
  const out=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line.includes("-->"))continue;

    const parts=line.split("-->");
    if(parts.length<2)continue;

    const start=parseTime(parts[0]);
    const end=parseTime(parts[1].split(/\s+/)[0]);
    if(!(end>start))continue;

    const textLines=[];
    let j=i+1;
    while(j<lines.length){
      const s=lines[j];
      if(!s.trim())break;
      if(s.includes("-->"))break;
      if(/^\d+$/.test(s.trim()) && textLines.length===0){j++;continue}
      textLines.push(s);
      j++;
    }

    out.push({
      start,
      end,
      text:textLines.join("\n").trim()
    });
    i=j-1;
  }
  return out.filter(x=>x.text);
}
function splitLang(text){
  const zh=[],en=[],other=[];
  for(const line of text.split(/\n+/).map(x=>x.trim()).filter(Boolean)){
    if(/[\u3400-\u9fff]/.test(line))zh.push(line);
    else if(/[A-Za-z]/.test(line))en.push(line);
    else other.push(line);
  }
  return {zh:zh.join("\n"),en:en.join("\n"),other:other.join("\n")};
}
function displayText(s){
  if(!s)return "请先导入字幕";
  const mode=$("#displayMode").value;
  if(mode==="none")return "";
  const p=splitLang(s.text);
  if(mode==="zh")return p.zh||"（本句没有中文）";
  if(mode==="en")return p.en||"（本句没有英文）";
  return [p.en,p.zh,p.other].filter(Boolean).join("\n")||s.text;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){
  $("#subtitle").textContent=displayText(subs[current]);
  $("#meta").textContent=subs.length?`${current+1} / ${subs.length}`:"0 / 0";
  $("#list").innerHTML=subs.map((s,i)=>`<div class="item ${i===current?"active":""}" onclick="go(${i})">${i+1}. ${escapeHtml(displayText(s))}</div>`).join("");
}
function go(i){
  if(!subs.length)return;
  clearTimeout(endTimer);
  current=Math.max(0,Math.min(subs.length-1,i));
  repeatDone=0;modeActive=false;lock=false;
  if(media)media.currentTime=subs[current].start;
  render();
}
function prevLine(){go(current-1)}
function nextLine(){go(current+1)}
function applySpeed(){if(media)media.playbackRate=+$("#speed").value}
function applySubtitleSize(){
  const n=+$("#subtitleSize").value||24;
  $("#subtitle").style.fontSize=n+"px";
  $("#list").style.fontSize=Math.max(14,n-6)+"px";
}
function onPlayModeChange(){
  clearTimeout(endTimer);
  modeActive=false;repeatDone=0;lock=false;
  $("#repeatWrap").style.display=$("#playMode").value==="repeatNext"?"block":"none";
}
function updatePlayButton(){
  $("#mainPlayPauseBtn").textContent=media&&!media.paused?"⏸ 暂停":"▶ 播放";
}
function currentSubtitleIndex(){
  if(!media||!subs.length)return -1;
  let idx=subs.findIndex(s=>media.currentTime>=s.start&&media.currentTime<s.end);
  if(idx<0)idx=Math.max(0,Math.min(current,subs.length-1));
  return idx;
}
function toggleMainPlayPause(){
  if(!media)return;
  if(!media.paused){media.pause();clearTimeout(endTimer);lock=false;return}
  startByMode();
}
function startByMode(){
  if(!media)return;
  clearTimeout(endTimer);lock=false;applySpeed();
  const mode=$("#playMode").value;

  if(mode==="full"){
    modeActive=false;
    media.play();
    return;
  }

  if(!subs.length){alert("请先导入字幕。");return}
  current=currentSubtitleIndex();
  render();
  repeatDone=0;modeActive=true;
  media.currentTime=subs[current].start;
  media.play();
}
function handleLineEnd(){
  if(lock||!modeActive||!media||!subs.length)return;
  lock=true;media.pause();media.currentTime=subs[current].end;
  const mode=$("#playMode").value;

  if(mode==="current"){
    modeActive=false;lock=false;repeatDone=0;return;
  }

  if(mode==="loop"){
    endTimer=setTimeout(()=>{
      media.currentTime=subs[current].start;lock=false;modeActive=true;applySpeed();media.play();
    },200);
    return;
  }

  if(mode==="repeatNext"){
    const rc=$("#repeatCount").value;
    const gapMs=(+$("#gap").value)*1000;

    if(rc==="inf"){
      endTimer=setTimeout(()=>{
        media.currentTime=subs[current].start;lock=false;modeActive=true;applySpeed();media.play();
      },gapMs);
      return;
    }

    const extraRepeats=Math.max(0,+rc);
    repeatDone++;

    if(repeatDone<=extraRepeats){
      endTimer=setTimeout(()=>{
        media.currentTime=subs[current].start;lock=false;modeActive=true;applySpeed();media.play();
      },gapMs);
      return;
    }

    if(current<subs.length-1){
      endTimer=setTimeout(()=>{
        current++;repeatDone=0;render();media.currentTime=subs[current].start;
        lock=false;modeActive=true;applySpeed();media.play();
      },gapMs);
      return;
    }

    modeActive=false;repeatDone=0;lock=false;
  }
}
function watch(){
  if(!media)return;
  updateTimes();drawWave();

  if(abLoopEnabled&&pointA!==null&&pointB!==null&&pointB>pointA){
    if(media.currentTime<pointA||media.currentTime>=pointB){
      media.currentTime=pointA;
      if(media.paused)media.play();
    }
    return;
  }

  if(!subs.length)return;

  if($("#playMode").value==="full"){
    const idx=subs.findIndex(s=>media.currentTime>=s.start&&media.currentTime<s.end);
    if(idx>=0&&idx!==current){current=idx;render()}
    return;
  }

  if(modeActive&&media.currentTime>=subs[current].end)handleLineEnd();
}

function getRewindSeconds(){return +$("#rewindSeconds").value||5}
function getForwardSeconds(){return +$("#forwardSeconds").value||5}
function seekRelative(delta){
  if(!media)return;
  clearTimeout(endTimer);lock=false;modeActive=false;
  const d=isFinite(media.duration)?media.duration:Infinity;
  media.currentTime=Math.max(0,Math.min(d,media.currentTime+delta));
  drawWave();updateTimes();
}

function setA(){if(!media)return;pointA=media.currentTime;if(pointB!==null&&pointB<=pointA)pointB=null;updateAB()}
function setB(){
  if(!media)return;
  pointB=media.currentTime;
  if(pointA!==null&&pointB<=pointA){alert("B 点必须在 A 点之后。");pointB=null}
  updateAB();
}
function toggleABLoop(){
  if(!media)return;
  if(!abLoopEnabled){
    if(pointA===null||pointB===null||pointB<=pointA){alert("请先设置 A 点和 B 点。");return}
    abLoopEnabled=true;
    if(media.currentTime<pointA||media.currentTime>=pointB)media.currentTime=pointA;
    if(media.paused)media.play();
  }else{
    abLoopEnabled=false;
  }
  updateAB();
}
function updateAB(){
  $("#btnA").classList.toggle("on",pointA!==null);
  $("#btnB").classList.toggle("on",pointB!==null);
  $("#btnAB").classList.toggle("on",abLoopEnabled);
  $("#btnAB").textContent=abLoopEnabled?"A/B循环 ✓":"A/B循环";
  $("#abInfo").textContent=`A：${pointA===null?"未设置":fmt(pointA)}　B：${pointB===null?"未设置":fmt(pointB)}`;
  drawWave();
}

async function buildWave(file){
  wavePeaks=[];waveReady=false;$("#waveStatus").textContent="正在生成波形…";
  try{
    const buf=await file.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)throw new Error();
    const ac=new AC(),audio=await ac.decodeAudioData(buf.slice(0)),ch=audio.getChannelData(0);
    const bins=700,step=Math.max(1,Math.floor(ch.length/bins));
    for(let i=0;i<bins;i++){
      let peak=0,start=i*step,end=Math.min(ch.length,start+step);
      for(let j=start;j<end;j+=Math.max(1,Math.floor(step/40)))peak=Math.max(peak,Math.abs(ch[j]));
      wavePeaks.push(peak);
    }
    waveReady=true;$("#waveStatus").textContent="波形已生成；白色竖线为当前进度，可点击或拖动定位。";
    try{await ac.close()}catch(_){}
  }catch(_){
    $("#waveStatus").textContent="当前媒体无法生成真实波形，但仍可点击/拖动进度条定位。";
  }
  drawWave();
}
function resizeCanvas(){
  const c=$("#wave"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h}
}
function drawWave(){
  const {ctx,w,h}=resizeCanvas();ctx.clearRect(0,0,w,h);ctx.fillStyle="#f4f5f7";ctx.fillRect(0,0,w,h);
  const ratio=media&&isFinite(media.duration)&&media.duration?media.currentTime/media.duration:0;
  if(waveReady&&wavePeaks.length){
    const mid=h/2;
    for(let i=0;i<wavePeaks.length;i++){
      const x=i/wavePeaks.length*w,amp=Math.max(1,wavePeaks[i]*(h*.44));
      ctx.fillStyle=(i/wavePeaks.length)<=ratio?"#1f6feb":"#9aa0a6";
      ctx.fillRect(x,mid-amp,Math.max(1,w/wavePeaks.length),amp*2);
    }
  }else{
    ctx.fillStyle="#c4c7cc";ctx.fillRect(0,h/2-2,w,4);ctx.fillStyle="#1f6feb";ctx.fillRect(0,h/2-2,w*ratio,4);
  }
  if(pointA!==null&&media?.duration){ctx.fillStyle="#0a8f45";ctx.fillRect(pointA/media.duration*w,0,2,h)}
  if(pointB!==null&&media?.duration){ctx.fillStyle="#d73a49";ctx.fillRect(pointB/media.duration*w,0,2,h)}
  if(media?.duration){
    const x=ratio*w;ctx.fillStyle="#fff";ctx.fillRect(Math.max(0,x-1.5),0,3,h);
    ctx.beginPath();ctx.arc(x,h/2,6,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke();
  }
}
function seekWave(ev){
  if(!media||!isFinite(media.duration))return;
  const r=$("#wave").getBoundingClientRect(),x=Math.max(0,Math.min(r.width,ev.clientX-r.left));
  media.currentTime=x/r.width*media.duration;modeActive=false;lock=false;drawWave();updateTimes();
}
$("#wave").addEventListener("pointerdown",e=>{dragWave=true;$("#wave").setPointerCapture(e.pointerId);seekWave(e)});
$("#wave").addEventListener("pointermove",e=>{if(dragWave)seekWave(e)});
$("#wave").addEventListener("pointerup",()=>dragWave=false);
$("#wave").addEventListener("pointercancel",()=>dragWave=false);
window.addEventListener("resize",drawWave);

function fmt(sec){
  if(!isFinite(sec))return"00:00";sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateTimes(){$("#curTime").textContent=fmt(media?.currentTime||0);$("#duration").textContent=fmt(media?.duration||0)}

function captureSelection(){
  setTimeout(()=>{
    const t=(window.getSelection()?.toString()||"").trim();
    if(!t||t.length>500)return;
    selectedText=t;$("#lookupText").textContent=t;$("#lookup").style.display="block";
  },80);
}
$("#subtitle").addEventListener("mouseup",captureSelection);
$("#subtitle").addEventListener("touchend",captureSelection);
$("#list").addEventListener("mouseup",captureSelection);
$("#list").addEventListener("touchend",captureSelection);
function googleSearchSelection(){
  if(!selectedText)return;
  window.open("https://www.google.com/search?q="+encodeURIComponent(selectedText),"_blank","noopener");
}
function speakSelection(){
  if(!selectedText)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(selectedText);
  u.lang=/[\u3400-\u9fff]/.test(selectedText)?"zh-CN":"en-US";u.rate=.9;speechSynthesis.speak(u);
}
function hideLookup(){$("#lookup").style.display="none"}

render();applySubtitleSize();onPlayModeChange();drawWave();updateAB();updatePlayButton();
</script>
</body>
</html>
